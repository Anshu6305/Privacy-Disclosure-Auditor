[project]
name = "privacy-disclosure-auditor"
version = "0.1.0"
description = "Cross-Source Privacy Disclosure Consistency Auditor for Android Applications"
# Upper bound is a real constraint, not caution. The pinned scientific stack
# (numpy 2.2.1, scipy 1.14.1, scikit-learn 1.6.0, pandas 2.2.3) publishes
# wheels up to CPython 3.13. On 3.14 pip falls back to building scipy from
# source, which needs OpenBLAS and pkg-config and fails on a stock macOS.
# Recommended: 3.12, which is what the container runs.
requires-python = ">=3.10,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
addopts = "-q --strict-markers"

# pytest-asyncio warns when this is unset and will change its default in a
# future release. Set explicitly so the suite behaves the same before and
# after that change.
asyncio_default_fixture_loop_scope = "function"

# Only third-party deprecations we cannot fix are silenced, named
# individually so our own warnings stay visible.
filterwarnings = [
    "ignore:The 'strip_cdata' option:DeprecationWarning",
    "ignore:Importing 'parser.split_arg_string':DeprecationWarning",
]
markers = [
    "integration: requires a running PostgreSQL instance",
    "ml: requires model weights or the ML dependency set",
    "slow: takes more than a few seconds",
]

[tool.ruff]
# Jupyter cells are not modules: a Colab notebook legitimately runs `!pip`
# before importing, and imports where the narrative needs them. Linting them
# as modules yields only E402/I001 noise, so the notebooks are excluded and
# reviewed as documents. The code they *run* is the repository's own, which
# is linted.
extend-exclude = ["notebooks"]
line-length = 100
# The OLDEST supported version, not the recommended one. requires-python
# allows 3.10, so linting at py312 would accept code that breaks there — it
# suggested datetime.UTC, which is 3.11+.
target-version = "py310"
exclude = [".venv", "data", "frontend", "backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as default arguments. B008 exists to catch an
# accidental shared mutable default; these are the framework's documented
# idiom and are re-evaluated per request, so they are declared immutable here
# rather than silenced with per-line noqa across every endpoint.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["data/", "frontend/", "backend/migrations/"]
